name: Web validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '.github/workflows/web-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build (no deployment)
        run: npm run build
